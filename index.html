<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Squishy Trade</title>
<meta name="theme-color" content="#ff8fc7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squishy Trade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#fff4fa; --ink:#3b2a4a; --muted:#8a7a99; --pink:#ff8fc7; --pink2:#ffc2e2; --purple:#a78bfa;
  --card:#ffffff; --line:#f1dbe9;
  --t0:#9aa5b1; --t1:#3fb56b; --t2:#3b8df0; --t3:#a24de8; --t4:#ff9a1f;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Rounded", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
  background-image:radial-gradient(circle at 10% 10%,#ffe3f2 0,transparent 40%),radial-gradient(circle at 90% 30%,#e9e1ff 0,transparent 40%),radial-gradient(circle at 30% 90%,#dff7ff 0,transparent 40%);
  background-attachment:fixed; overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(255,244,250,.85);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:.3px}
.logo span{color:var(--pink)}
.coins{background:#fff;border:2px solid #ffd76a;border-radius:999px;padding:6px 12px;font-weight:800;display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 #ffd76a}
.coins.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.92)}100%{transform:scale(1)}}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:#fff;
  border-top:2px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:14px}
nav button .ic{font-size:24px;transition:transform .2s}
nav button.on{color:var(--ink);background:var(--pink2)}
nav button.on .ic{transform:scale(1.15) rotate(-6deg)}
h2{margin:6px 0 12px;font-size:22px}
h3{margin:16px 0 8px}
.muted{color:var(--muted)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}
.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:900;font-size:16px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #e06aa6;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e06aa6}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.green{background:#3fc77a;box-shadow:0 4px 0 #2a9a5a}
.btn.red{background:#ff6b6b;box-shadow:0 4px 0 #d64545}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 #7c5fd6}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input,select{font-family:inherit;font-size:16px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.card{position:relative;background:#fff;border-radius:20px;padding:10px 8px 8px;text-align:center;border:3px solid var(--tc,var(--t0));
  box-shadow:0 4px 0 var(--tc,var(--t0));user-select:none;overflow:hidden}
.card.tap:active, .card.squish{animation:squish .35s}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.12,.82)}60%{transform:scale(.93,1.08)}100%{transform:scale(1)}}
.card .blob{width:64px;height:64px;margin:0 auto 6px;border-radius:50% 50% 46% 46%;display:grid;place-items:center;font-size:38px;background:var(--bc,#ffe)}
.grid.small .card .blob{width:46px;height:46px;font-size:28px}
.card .nm{font-weight:900;font-size:12.5px;line-height:1.15;min-height:29px}
.grid.small .card .nm{font-size:10.5px;min-height:24px}
.card .br{font-size:10.5px;color:var(--muted);font-weight:700}
.card .val{font-size:12px;font-weight:900;margin-top:4px}
.card .tier{position:absolute;top:6px;left:6px;font-size:9px;font-weight:900;color:#fff;background:var(--tc);padding:2px 6px;border-radius:999px}
.card .vtag{position:absolute;top:6px;right:6px;font-size:13px}
.card.locked{opacity:.45}
.card.locked::after{content:"🔒 på bordet";position:absolute;inset:auto 0 0 0;font-size:10px;font-weight:800;background:#000a;color:#fff;padding:2px}
.t0{--tc:var(--t0)}.t1{--tc:var(--t1)}.t2{--tc:var(--t2)}.t3{--tc:var(--t3)}.t4{--tc:var(--t4)}
/* variants */
.v-g .blob{position:relative}
.v-g .blob::after{content:"✨";position:absolute;right:-6px;top:-6px;font-size:18px;animation:twinkle 1.4s infinite}
.v-g{background:linear-gradient(160deg,#fff 0%,#fff6d9 50%,#fff 100%)}
@keyframes twinkle{50%{transform:scale(.6) rotate(30deg);opacity:.5}}
.v-r{border:0;padding:13px 11px 11px;background:
  linear-gradient(#fff,#fff) padding-box,
  linear-gradient(var(--ang,0deg),#ff5f6d,#ffc371,#47e891,#3fa9f5,#b06bff,#ff5f6d) border-box;border:3px solid transparent;border-radius:20px;animation:spinb 3s linear infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinb{to{--ang:360deg}}
.v-gold{background:linear-gradient(150deg,#fff8d6,#ffe27a 45%,#fff3b8 60%,#ffd04a);box-shadow:0 0 14px #ffcf3f,0 4px 0 #d9a400;border-color:#e3b400}
.v-gold .nm,.v-gold .val{color:#6b4a00}

/* Shop */
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.box{border-radius:22px;padding:14px;text-align:center;color:#fff;font-weight:900;box-shadow:0 5px 0 #0002;position:relative;overflow:hidden}
.box .e{font-size:52px;display:block;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}
.box small{display:block;font-weight:700;opacity:.9;margin:4px 0 10px;font-size:12px}
.box .btn{background:#fff;color:var(--ink);box-shadow:0 4px 0 #0003;width:100%}
.b1{background:linear-gradient(150deg,#7dd3fc,#3b82f6)}
.b2{background:linear-gradient(150deg,#c084fc,#7c3aed)}
.b3{background:linear-gradient(150deg,#fbbf24,#f43f5e)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--muted)}
.chips button.on{background:var(--pink);border-color:var(--pink);color:#fff}

/* Quiz */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cat{border:0;border-radius:20px;padding:16px 10px;font-weight:900;font-size:15px;color:var(--ink);box-shadow:0 4px 0 #0001}
.cat .e{font-size:34px;display:block;margin-bottom:4px}
.qbox{text-align:center}
.qtext{font-size:22px;font-weight:900;margin:10px 0 16px;line-height:1.25}
.qbig{font-size:84px;line-height:1;margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;font-weight:800;font-size:16px;color:var(--ink);box-shadow:0 4px 0 var(--line);min-height:58px}
.opt.ok{background:#c9f7d9;border-color:#3fc77a;box-shadow:0 4px 0 #3fc77a;animation:squish .4s}
.opt.no{background:#ffd3d3;border-color:#ff6b6b;box-shadow:0 4px 0 #ff6b6b;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.streak{background:#fff0c2;border-radius:999px;padding:4px 10px}
.coinfly{position:fixed;font-weight:900;font-size:22px;color:#e0a800;pointer-events:none;z-index:90;animation:fly 1s forwards}
@keyframes fly{to{transform:translateY(-80px);opacity:0}}

/* Trade board */
.board{border-radius:26px;padding:12px;background:
  repeating-linear-gradient(45deg,#ffe9f5 0 14px,#fff 14px 28px);border:3px dashed var(--pink);margin-bottom:12px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:#fffc;border-radius:18px;padding:8px;min-height:170px;border:2px solid var(--line);position:relative}
.side h4{margin:2px 0 6px;font-size:14px;display:flex;justify-content:space-between}
.side.acc{border-color:#3fc77a;box-shadow:0 0 0 3px #3fc77a55}
.side .accb{font-size:12px;color:#2a9a5a;font-weight:900}
.side .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 4px}
.side .grid.small{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.side .card .blob{width:40px;height:40px;font-size:24px}
.side .card .nm{font-size:9.5px;min-height:22px}
.side .card .br{display:none}
.side .card{animation:drop .35s}
@keyframes drop{0%{transform:translateY(-30px) scale(.6);opacity:0}70%{transform:translateY(3px) scale(1.06,.92)}100%{transform:none;opacity:1}}
.fair{text-align:center;font-weight:800;margin:8px 0;font-size:14px}
.tbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.status{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:#ccc}
.dot.on{background:#3fc77a;box-shadow:0 0 0 4px #3fc77a33}
.code{font-size:40px;font-weight:900;letter-spacing:8px;text-align:center;background:#fff;border:3px dashed var(--purple);border-radius:18px;padding:10px;margin:10px 0}
.chat{max-height:150px;overflow-y:auto;font-size:14px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.msg{background:#f5effa;border-radius:12px;padding:6px 10px;align-self:flex-start;max-width:85%}
.msg.me{background:var(--pink2);align-self:flex-end}
.msg.sys{background:none;color:var(--muted);font-size:12px;align-self:center}

/* Modal & reveal */
.modal{position:fixed;inset:0;background:#3b2a4a99;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.center{align-items:center}
.center .sheet{border-radius:26px;margin:16px;max-width:420px}
#reveal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#4a2a6b,#1c1030);color:#fff;text-align:center;overflow:hidden}
#reveal.show{display:flex}
#rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;opacity:0;
  background:repeating-conic-gradient(var(--rc,#fff) 0 8deg,transparent 8deg 20deg);animation:rot 8s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
#reveal.big #rays{opacity:.55;transition:opacity .4s}
@keyframes rot{to{transform:rotate(360deg)}}
#rbox{font-size:120px;position:relative;z-index:2}
#rbox.shake{animation:boxshake .12s infinite}
@keyframes boxshake{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(-8deg)}}
#rbox.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(2.4);opacity:0}}
#ritem{position:relative;z-index:2;display:none}
#ritem.on{display:block;animation:popin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
#ritem .card{width:200px;margin:0 auto;padding:16px}
#ritem .card .blob{width:120px;height:120px;font-size:80px}
#ritem .card .nm{font-size:18px;min-height:0}
#ritem .card .br{font-size:13px}
#ritem .card .val{font-size:18px}
#rlabel{font-size:34px;font-weight:900;margin:16px 0 4px;position:relative;z-index:2;text-shadow:0 3px 0 #0005;min-height:42px}
#rlabel.pop{animation:lab 1s ease-in-out infinite}
@keyframes lab{50%{transform:scale(1.15) rotate(-3deg)}}
#rsub{position:relative;z-index:2;opacity:.85;min-height:22px}
#rnext{position:relative;z-index:2;margin-top:18px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:85}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:95;animation:up .2s;max-width:90vw;text-align:center}
.dexbar{height:14px;background:#f1dbe9;border-radius:999px;overflow:hidden;margin:6px 0}
.dexbar div{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple))}
.card.unknown{filter:grayscale(1) brightness(1.6);opacity:.55}
nav button{position:relative}
nav button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:0;right:18%;background:#ff4d6d;color:#fff;font-size:11px;font-weight:900;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 4px}

/* Tradingbrett */
.tboard{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:6px;background:linear-gradient(#f9dfe9,#f3d0de);border-radius:24px;padding:9px;box-shadow:inset 0 2px 0 #fff9,0 6px 0 #e3a9bf,0 10px 24px #e3a9bf55;border:2px solid #edbccf}
.tcol{display:flex;flex-direction:column;gap:7px}
.tbtn{flex:1;min-height:70px;border-radius:16px;background:#fdf1f6;border:2px solid #e7b2c6;font-size:34px;font-weight:900;color:#d76d90;display:grid;place-items:center;box-shadow:0 3px 0 #e7b2c6;padding:0;line-height:1;font-family:system-ui}
.tbtn.plus{color:#eaa5bd}.tbtn.ask{font-size:26px}.tbtn.ask.on{background:#fff3c4;border-color:#f2c94c;box-shadow:0 3px 0 #f2c94c;opacity:1!important}
button.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e7b2c6}
button.tbtn:disabled{opacity:.45}
.tcol.them .tbtn{opacity:.55}
.tbtn.arrow.on{background:#c9f7d9;color:#24a35a;border-color:#3fc77a;box-shadow:0 3px 0 #3fc77a;opacity:1!important;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #3fc77a44,0 3px 0 #3fc77a}}
.tpanel{background:#f5dce6;border:2px solid #e3a9bf;border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.tpanel.acc{border-color:#3fc77a;box-shadow:0 0 0 3px #3fc77a55}
.tpanel .ph,.tpanel .pv{font-size:12px;font-weight:900;text-align:center;color:#9a5a75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{height:56px;border-radius:12px;border:2px dashed #e6b3c6;display:flex;align-items:center;gap:5px;padding:3px 5px;background:#fbeef3;position:relative;min-width:0}
.slot:not(.empty){border:2px solid var(--tc);background:#fff}
.slot.v-gold{background:linear-gradient(150deg,#fff8d6,#ffe27a);box-shadow:0 0 8px #ffcf3f}
.slot.v-r{background:linear-gradient(90deg,#ffe4e6,#fff4d6,#e3fbe9,#e0f0ff,#f1e4ff)}
.slot.v-g{background:linear-gradient(150deg,#fff,#fff6d9)}
.slot .sb{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bc)}
.slot .si{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.slot .si b{font-size:10px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.slot .si span{font-size:9.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.slot .sx{position:absolute;top:-6px;right:-6px;background:#ff6b6b;color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:grid;place-items:center;font-weight:900}
.slot.pop{animation:drop .45s}
.slot.out{animation:none;transform:scale(.2);opacity:0;transition:.2s}
.cw{position:relative}
.shopitem.oos .card{filter:grayscale(1);opacity:.5}
.oosr{position:absolute;top:42%;left:-4px;right:-4px;text-align:center;background:#ff6b6b;color:#fff;font-weight:900;font-size:13px;padding:3px 0;transform:rotate(-8deg);box-shadow:0 2px 6px #0003;letter-spacing:1px}
.rs{position:absolute;top:-6px;left:-4px;background:#24a35a;color:#fff;font-weight:900;font-size:10px;padding:3px 7px;border-radius:10px;animation:glow2 1.2s ease-in-out infinite;z-index:3}
@keyframes glow2{50%{box-shadow:0 0 0 5px #3fc77a55}}
.cdl{font-size:11px;font-weight:800;color:var(--muted);text-align:center;margin:2px 0 4px;min-height:14px}
.restock{background:#c9f7d9;border:2px solid #3fc77a;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:14px;animation:glow2 1.4s ease-in-out infinite}
.box.oosb{filter:grayscale(.8);opacity:.7}
.faketag{position:absolute;bottom:34px;right:-2px;background:#777;color:#fff;font-size:9px;font-weight:900;padding:1px 5px;border-radius:6px;transform:rotate(8deg);z-index:2}
.card .faketag{bottom:auto;top:30px}
.tstatus{text-align:center;font-weight:900;margin:12px 0 2px;font-size:15px}
.tstatus.hot{color:#24a35a;animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{transform:scale(1.04)}}
.emotes{display:flex;justify-content:center;gap:8px;margin-top:6px}
.emotes button{font-size:24px;border:2px solid var(--line);background:#fff;border-radius:14px;width:46px;height:46px;padding:0}
.emotes button:active{transform:scale(.9)}
.emote{position:fixed;font-size:60px;z-index:90;pointer-events:none;animation:emo 1.6s ease-out forwards}
@keyframes emo{0%{transform:scale(0)}20%{transform:scale(1.3)}40%{transform:scale(1)}100%{transform:translateY(-120px) scale(1.1);opacity:0}}
@media (max-width:360px){.tboard{grid-template-columns:44px 1fr 1fr 44px;gap:5px;padding:7px}.tbtn{font-size:28px;min-height:62px}.slot .sb{width:32px;height:32px;font-size:20px}}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.blob.art,.sb.art{background:none!important;box-shadow:none!important;padding:0}
.blob.art svg,.sb.art svg{width:100%;height:100%;display:block}
.card .blob.art{width:72px;height:72px}.grid.small .card .blob.art{width:54px;height:54px}.side .card .blob.art{width:46px;height:46px}#ritem .card .blob.art{width:130px;height:130px}
.slot .sb.art{width:40px;height:40px;border-radius:0}
.cdot{position:absolute;left:6px;bottom:6px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0004}
.cdot2{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid #0002}.colchips{margin:8px 0;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:8px;padding:6px 0}.cdot2.big{width:22px;height:22px;margin:0}.fn{font-weight:900;min-width:34px;text-align:right}.fok{font-size:20px}
.btn.sm{padding:6px 12px;font-size:13px;width:auto}
.auc{display:flex;gap:12px;align-items:center}.auc.lead{border:2px solid #4cc577}.aucard{width:100px;flex:none}.aucinfo{flex:1;display:flex;flex-direction:column;gap:3px}

function hsh(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function stockP(d){ return d.fake?1 : (PERMA.has(d.id)||d.tier>=4)?0 : STOCK_P[d.tier]; }
function inStockAt(key,p,t){ if(p>=1) return true; if(p<=0) return false; const off=hsh(key)%SLOT, slot=Math.floor((t-off)/SLOT); return (hsh(key+"|"+slot)%1000)/1000<p; }
function stockInfo(key,p,t=Date.now()){
  if(p>=1) return {on:true};
  if(p<=0) return {on:false,never:true};
  const off=hsh(key)%SLOT, slot=Math.floor((t-off)/SLOT);
  if(!inStockAt(key,p,t)){
    for(let k=1;k<=80;k++){ if(inStockAt(key,p,off+(slot+k)*SLOT+1)) return {on:false,next:off+(slot+k)*SLOT}; }
    return {on:false,never:true};
  }
  const start=off+slot*SLOT, fresh=!inStockAt(key,p,start-1)&&(t-start)<45*60*1000;
  let end=null; for(let k=1;k<=80;k++){ if(!inStockAt(key,p,off+(slot+k)*SLOT+1)){ end=off+(slot+k)*SLOT; break; } }
  return {on:true,fresh,start,end};
}
const stockOf=d=>stockInfo(d.id,stockP(d));

/* ---------- KLEM PÅ SQUISHIES ---------- */
let _ac=null;
function squeak(fake,dn){
  try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const t=_ac.currentTime, o=_ac.createOscillator(), g=_ac.createGain();
    o.type=fake?"sawtooth":"sine"; const f=(fake?180:520)+Math.random()*120;
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(dn?f*0.55:f*1.5,t+0.14);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(fake?0.05:0.09,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t+0.2); }catch(e){}
}
function setupSqueeze(m,d){
  const st=m.querySelector("#sqs"), body=m.querySelector(".sqbody"), nEl=m.querySelector("#sqn"); if(!st) return;
  const fake=!!d.fake; let sy=1,vy=0,tgt=1,raf=0,last=0,down=false,mine=0;
  const tick=ts=>{ const dt=Math.min(0.03,(ts-last)/1000||0.016); last=ts;
    const k=240,c=fake?22:7.5; vy+=(-k*(sy-tgt)-c*vy)*dt; sy+=vy*dt;
    body.style.transform=`scale(${1+(1-sy)*0.55},${sy})`;
    if(down||Math.abs(sy-tgt)>0.002||Math.abs(vy)>0.01) raf=requestAnimationFrame(tick); else { raf=0; body.style.transform=""; } };
  const kick=()=>{ if(!raf){ last=performance.now(); raf=requestAnimationFrame(tick); } };
  const press=e=>{ e.preventDefault(); if(down) return; down=true; tgt=fake?0.82:0.58; try{st.setPointerCapture(e.pointerId);}catch(x){}
    squeak(fake,true); if(navigator.vibrate) navigator.vibrate(fake?8:18);
    S.stats.squeezes=(S.stats.squeezes||0)+1; mine++;
    if(S.stats.squeezes%100===0){ setCoins(S.coins+10); toast("🤗 100 klemmer! +10 🪙"); save(); }
    else if(S.stats.squeezes%10===0) save();
    nEl.textContent=`🤗 Klemt ${mine} ganger nå · ${S.stats.squeezes} totalt`; kick(); };
  const rel=()=>{ if(!down) return; down=false; tgt=1; squeak(fake,false); kick(); };
  st.addEventListener("pointerdown",press); st.addEventListener("pointerup",rel); st.addEventListener("pointercancel",rel); st.addEventListener("pointerleave",rel);
}

const COLGOAL=5, COLBONUS=150, RAINBOW_BONUS=800;
function colorStats(){
  const own={}; for(const i of S.inv){ const k=itemCol(i); if(!k) continue; (own[k]=own[k]||new Set()).add(i.id); }
  const out={};
  for(const k of Object.keys(COLS)){

    const goal=Math.min(COLGOAL,avail||COLGOAL), n=own[k]?own[k].size:0;
    out[k]={n,goal,avail,done:!!(S.claims&&S.claims[k]),ready:n>=goal&&!(S.claims&&S.claims[k]),has:n>0};
  }
  return out;
}

async function bid(id,amt){

  try{
    await FB.runTransaction(R("auctions/"+id),a=>{ did=false; if(!a||a.state!=="open"||a.end<=Date.now()||a.seller===me||amt<minNext(a)) return; prev=a.by?{by:a.by,cur:a.cur}:null; nm=aucName(a); a.cur=amt; a.by=me; a.bname=S.name; did=true; return a; });

const settling=new Set();

  if(snap){ const nm=aucName(snap);
    if(snap.by){ inboxPush(snap.by,{item:snap.item,from:snap.sname||"",txt:"🎉 Du vant "+nm+"!"}); inboxPush(snap.seller,{coins:snap.cur,txt:"💰 "+nm+" ble solgt for 🪙 "+snap.cur}); }

/* ---------- NIVÅ-PROGRESJON ---------- */
const PCATS=["matte","flagg","hoved","historie","boker","natur","kropp","sprak","rekord","aktuelt"], NEED=5, LVN=["","Lett","Middels","Voksen"];
function progOf(c){ const p=S.prog&&S.prog[c]; return p?{c:p.c||0,n:p.n||0}:{c:Math.max(0,Math.min(3,(S.lvl||2)-1)),n:0}; }
function unlockedTier(){ return Math.min(3,1+Math.min(...PCATS.map(c=>progOf(c).c))); }
function catLevel(c){ return Math.max(1,Math.min(progOf(c).c+1,unlockedTier(),3)); }
function catState(c){ const p=progOf(c), U=unlockedTier(); if(p.c>=3) return {t:"mester",lvl:3,n:NEED}; if(p.c+1>U) return {t:"vent",lvl:U,c:p.c}; return {t:"gar",lvl:p.c+1,n:p.n}; }
function countProgress(cat,lvl){
  if(!PCATS.includes(cat)) return;
  const st=catState(cat); if(st.t!=="gar"||st.lvl!==lvl) return;
  if(!S.prog){ S.prog={}; for(const c of PCATS){ const p=progOf(c); S.prog[c]={c:p.c,n:p.n}; } }
  const p=S.prog[cat]; p.n=(p.n||0)+1; const before=unlockedTier();
  if(p.n>=NEED){ p.c=lvl; p.n=0; const CB=[0,30,50,100][lvl]; setCoins(S.coins+CB);
    const cn=CATS.find(x=>x.id===cat).name; const after=unlockedTier();
    if(p.c>=3) toast("🏆 "+cn+": Mester! +"+CB+" 🪙",4500);
    else if(after>before){ setCoins(S.coins+100); toast("🔓 Nivå "+after+" åpnet i alle kategorier! +"+(CB+100)+" 🪙",5500); }
    else toast("⭐ "+cn+" nivå "+lvl+" klart! +"+CB+" 🪙 – klar resten for å åpne nivå "+(lvl+1),5000); }
  FB.set(R(`players/${me}/prog`),S.prog).catch(fail);
}
function progPanel(){
  const U=unlockedTier(), done=PCATS.filter(c=>progOf(c).c>=U).length;
  return `<div class="panel"><b>🧭 Nivå ${U} (${LVN[U]})</b><div class="muted" style="margin-top:4px">${U>=3&&done===PCATS.length?"Du er mester i alle kategorier! 🏆":`Svar riktig ${NEED} ganger i hver kategori for å klare nivå ${U}. Når alle er klare, åpnes nivå ${Math.min(3,U+1)}. (${done}/${PCATS.length} klare)`}</div></div>`;
}
function catBadge(c){ const st=catState(c);
  if(st.t==="mester") return `<span class="cbadge m">🏆 Mester</span>`;
  if(st.t==="vent") return `<span class="cbadge w"><b>✅ Nivå ${st.c} klart</b><br>venter på resten</span>`;
  return `<span class="cbadge lv${st.lvl}"><b>${["","🟢","🟡","🔴"][st.lvl]} Nivå ${st.lvl}</b><br><span class="dots">${"●".repeat(st.n)}${"○".repeat(NEED-st.n)}</span></span>`; }

function mcq(q,a,wrong,big){ return {q,a:String(a),opts:shuffle([String(a),...wrong.slice(0,3).map(String)]),big}; }
function numWrong(a,spread){ const s=new Set(); while(s.size<3){ let w=a+rnd(-spread,spread); if(w!==a&&w>=0) s.add(w); } return [...s]; }
function genMathAdult(){
  const t=pick(["mul","pst","rab","ekv","kv","rot","brok","snitt","tid","dev"]);
  let q,a;
  if(t==="mul"){ const x=rnd(12,99),y=rnd(6,19); q=`Hva er ${x} × ${y}?`; a=x*y; }
  else if(t==="pst"){ const p=pick([5,15,20,25,30,35,40,60,75]), x=rnd(2,40)*20; q=`Hva er ${p} % av ${x}?`; a=x*p/100; }
  else if(t==="rab"){ const p=pick([10,20,25,30,40,50]), x=rnd(4,40)*40; q=`En vare koster ${x} kr. Du får ${p} % rabatt. Hva blir prisen?`; a=x*(100-p)/100; }
  else if(t==="ekv"){ const x=rnd(3,25), k=rnd(2,9), c=rnd(1,40); q=`Løs for x: ${k}x + ${c} = ${k*x+c}`; a=x; }
  else if(t==="kv"){ const x=rnd(11,30); q=`Hva er ${x}²?`; a=x*x; }
  else if(t==="rot"){ const x=rnd(6,25); q=`Hva er kvadratroten av ${x*x}?`; a=x; }
  else if(t==="brok"){ const n=pick([2,3,4,5,8]), x=rnd(2,12)*n, k=rnd(1,n-1); q=`Hva er ${k}/${n} av ${x}?`; a=x/n*k; }
  else if(t==="snitt"){ const a1=rnd(4,12),b1=rnd(4,12),c1=rnd(4,12); const tot=a1+b1+c1, pad=(3-tot%3)%3; const c2=c1+pad; q=`Hva er gjennomsnittet av ${a1}, ${b1} og ${c2}?`; a=(a1+b1+c2)/3; }
  else if(t==="tid"){ const h=rnd(2,9), mm=pick([15,30,45]); q=`Hvor mange minutter er ${h} timer og ${mm} minutter?`; a=h*60+mm; }
  else { const x=rnd(3,12), y=rnd(3,12), z=rnd(2,9); q=`Hva er (${x} + ${y}) × ${z}?`; a=(x+y)*z; }
  return mcq(q, a, numWrong(a, Math.max(4,Math.round(a*0.12))));
}
function genMath(lvl){
  if(lvl>=3) return genMathAdult();
  const t = lvl===1 ? pick(["+","+","-","-","x"]) : pick(["+","-","x","x",":","halv","pst"]);
  let q,a;
  if(lvl===1){
    if(t==="+"){ const x=rnd(2,30),y=rnd(2,20); q=`${x} + ${y}`; a=x+y; }
    else if(t==="-"){ const x=rnd(10,50),y=rnd(1,x); q=`${x} − ${y}`; a=x-y; }
    else { const x=rnd(2,5),y=rnd(1,10); q=`${x} × ${y}`; a=x*y; }
  } else {
    if(t==="+"){ const x=rnd(50,600),y=rnd(20,400); q=`${x} + ${y}`; a=x+y; }
    else if(t==="-"){ const x=rnd(100,1000),y=rnd(10,x); q=`${x} − ${y}`; a=x-y; }
    else if(t==="x"){ const x=rnd(3,12),y=rnd(3,12); q=`${x} × ${y}`; a=x*y; }
    else if(t===":"){ const y=rnd(2,10),a0=rnd(2,12); q=`${y*a0} : ${y}`; a=a0; }
    else if(t==="halv"){ const x=rnd(5,60)*2; q=`Hva er halvparten av ${x}?`; a=x/2; }
    else { const x=rnd(1,30)*10; q=`Hva er 10 % av ${x}?`; a=x/10; }
  }
  return mcq(q.includes("?")?q:`Hva er ${q}?`, a, numWrong(a, Math.max(3,Math.round(a*0.15))));
}

  const lvl=catLevel(cat), cs=COUNTRIES.filter(c=>lvl>=3?c[3]>=2:c[3]<=lvl);
  const out=genQ2(cat,lvl,cs); out.cat=cat; out.lvl=lvl; return out;
}
function genQ2(cat,lvl,cs){
  if(cat==="matte") return genMath(lvl);
  if(cat==="flagg"||cat==="hoved"){
    const c=pick(cs), others=shuffle(COUNTRIES.filter(x=>x!==c&&x[3]<=Math.max(lvl,1)+ (lvl===1?0:0)));

                            : mcq(`${c[2]} er hovedstaden i hvilket land?`, c[0], others.map(o=>o[0]), "🏙️");

function boardTx(fn){ const k=bkey(me,tv.opp); return FB.runTransaction(R("boards/"+k),b=>{ b=b||{}; b.offers=b.offers||{}; b.acc=b.acc||{}; const r=fn(b); if(r===false) return; b.upd=Date.now(); return b; }).catch(fail); }

async function acceptBoard(){
  const o=tv.opp, k=bkey(me,o);
  try{
    await FB.runTransaction(FB.ref(db),root=>{
      if(!root) return root;
      const b=root.boards&&root.boards[k]; if(!b) return;
      b.offers=b.offers||{}; b.acc=b.acc||{};
      const mine=Object.keys(b.offers[me]||{}), theirs=Object.keys(b.offers[o]||{});
      if(!mine.length&&!theirs.length) return;
      b.acc[me]=true; b.upd=Date.now();
      if(b.acc[o]){
        const A=root.players[me], B=root.players[o]; if(!A||!B) return;
        A.inv=A.inv||{}; B.inv=B.inv||{};
        if(!mine.every(u=>A.inv[u])||!theirs.every(u=>B.inv[u])){ b.offers={}; b.acc={}; b.ev={id:uid(),type:"failed",by:me,at:Date.now()}; return root; }
        const now=Date.now(), got={[me]:{},[o]:{}};
        const move=(F,T,list,to)=>list.forEach(u=>{ const it=F.inv[u]; delete F.inv[u]; const nu=uid(); T.inv[nu]={id:it.id,v:it.v,k:it.k||"",at:now,from:F.name||""}; T.dex=T.dex||{}; T.dex[it.id]=true; got[to][nu]={id:it.id,v:it.v,k:it.k||""}; });
        move(A,B,mine,o); move(B,A,theirs,me);
        b.last={id:uid(),at:now,got}; b.offers={}; b.acc={};
      }
      return root;
    });
  }catch(e){ fail(e); }
}

function swapAnim(o,done){
  if(view!=="trade"||tv.opp!==o){ done(); return; }
  const L=document.querySelector(".tpanel.me"), Rr=document.querySelector(".tpanel.them");
  if(!L||!Rr){ done(); return; }
  const d=Rr.getBoundingClientRect().left-L.getBoundingClientRect().left;
  L.style.transition=Rr.style.transition="transform .7s cubic-bezier(.5,-0.3,.4,1.3)";
  L.style.transform=`translateX(${d}px) rotate(4deg)`; Rr.style.transform=`translateX(${-d}px) rotate(-4deg)`;
  try{navigator.vibrate&&navigator.vibrate([60,40,60]);}catch(e){}
  setTimeout(done,800);
}
function showEmote(e,who){
  const el=document.querySelector(who===me?".tpanel.me":".tpanel.them"); const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const f=document.createElement("div"); f.className="emote"; f.textContent=e; f.style.left=(r.left+r.width/2-30)+"px"; f.style.top=(r.top+r.height/2-30)+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),1600);
}
// --- visning ---
function slotHTML(it,mine){
  if(!it) return `<div class="slot empty"></div>`;
  const d=DEF[it.id], v=VARIANTS[it.v]; const isNew=!shownNew.has(it.uid); shownNew.add(it.uid);
  return `<div class="slot t${d.tier} v-${it.v} ${isNew?"pop":""} ${mine?"rm":""}" data-uid="${it.uid}">
     <div class="sb art">${artSVG(d,it.k)}</div>
     <div class="si"><b>${v.icon?v.icon+" ":""}${esc(d.name)}</b><span>🪙 ${value(it)}</span></div>${mine?'<span class="sx">✕</span>':""}</div>`;
}
function vTrade(m){
  const os=others();
  if(!os.length){ m.innerHTML=`<h2>Tradingbrett 🤝</h2><div class="panel muted">Ingen andre spillere ennå. Når søsteren din lager en spiller, kan dere trade her.</div>`; return; }
  const o=ensureOpp(), k=bkey(me,o), b=BOARDS[k]||{}, offers=b.offers||{}, acc=b.acc||{};
  const mine=itemsOf(offers[me]), theirs=itemsOf(offers[o]);
  const vm=invValue(mine), vt=invValue(theirs), any=mine.length+theirs.length>0;
  const slots=(items,mineSide)=>Array.from({length:MAXB},(_,i)=>slotHTML(items[i],mineSide)).join("");
  const asked=b.ask&&b.ask.by===me&&Date.now()-b.ask.at<600000, askOld=!(b.ask&&Date.now()-b.ask.at<600000);
  let status = !any ? "Legg squishies på brettet med «＋ Legg til»" :
    acc[me]&&acc[o] ? "Bytter…" :
    acc[me] ? `Du har godtatt ✅ Venter på ${esc(pname(o))}…` :
    acc[o] ? `🎉 ${esc(pname(o))} har godtatt! Trykk på pila for å godta du også` :
    "Trykk på pila når du er fornøyd";
  m.innerHTML=`
   ${os.length>1?`<div class="chips">${os.map(p=>`<button class="${p===o?"on":""}" data-p="${p}">${esc(pname(p))}</button>`).join("")}</div>`:""}
   <div class="row" style="justify-content:space-between;margin-bottom:8px">
     <h2 style="margin:0">Tradingbrett</h2>
     <div class="status"><span class="dot ${isHere(b,o)?"on":""}"></span>${esc(pname(o))} ${isHere(b,o)?"er på brettet":"er ikke her nå"}</div>
   </div>
   <div class="tboard">
     <div class="tcol">
       <button class="tbtn x" id="bx" ${any?"":"disabled"} aria-label="Avslå">✕</button>
       <button class="tbtn ask ${asked?"on":""}" id="bm" aria-label="Be om mer">☝️</button>
       <button class="tbtn arrow ${acc[me]?"on":""}" id="ba" ${any?"":"disabled"} aria-label="Godta">‹</button>
     </div>
     <div class="tpanel me ${acc[me]?"acc":""}"><div class="ph">Du ${acc[me]?"✅":""}</div>${slots(mine,true)}<div class="pv">🪙 ${vm}</div></div>
     <div class="tpanel them ${acc[o]?"acc":""}"><div class="ph">${esc(pname(o))} ${acc[o]?"✅":""}</div>${slots(theirs,false)}<div class="pv">🪙 ${vt}</div></div>
     <div class="tcol them">
       <div class="tbtn arrow ${acc[o]?"on":""}">›</div>
       <div class="tbtn ask ${b.ask&&b.ask.by===o&&!askOld?"on":""}">☝️</div>
       <div class="tbtn x">✕</div>
     </div>
   </div>
   <div class="addrow"><button class="btn sec" id="bp" ${mine.length>=MAXB?"disabled":""}>＋ Legg til squishy</button></div>
   ${b.ask&&b.ask.by===o&&!askOld?`<div class="askbar">☝️ ${esc(pname(o))} vil ha mer på brettet fra deg!</div>`:""}
   <div class="tstatus ${acc[o]&&!acc[me]?"hot":""}">${status}</div>
   <div class="fair">Du gir 🪙 ${vm} · du får 🪙 ${vt} ${any?(vt>=vm?"😊":"🤔"):""}</div>
   <div class="emotes">${["👍","🤔","😍","🙏","😂","😢"].map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div>
   <div class="panel" style="margin-top:12px"><b>${esc(pname(o))} sin samling</b> <span class="muted">(🪙 ${invValue(invOf(o))})</span>
     <div class="grid small" style="margin-top:8px">${invOf(o).sort((a,b)=>value(b)-value(a)).map(i=>card(i,{cls:"peek"})).join("")||'<span class="muted">Tom</span>'}</div></div>`;
  m.querySelectorAll(".chips [data-p]").forEach(x=>x.onclick=()=>{ tv.opp=x.dataset.p; heartbeat(); render(); });
  m.querySelector("#bp").onclick=()=>picker("Legg på brettet",S.inv.filter(i=>!isOffered(i.uid)),it=>addToBoard(it));
  m.querySelector("#bm").onclick=()=>{ boardTx(b=>{ b.ask={id:uid(),by:me,at:Date.now()}; b.acc={}; }); toast("☝️ Du ba "+pname(o)+" legge til mer"); };
  m.querySelector("#ba").onclick=()=>{ squishOn(m.querySelector("#ba")); acc[me]?unaccept():acceptBoard(); };
  m.querySelector("#bx").onclick=async()=>{ if(await confirmBox("Avslå og tøm brettet?","Avslå ❌")) declineBoard(); };
  m.querySelectorAll(".tpanel.me .slot.rm").forEach(s=>s.onclick=()=>{ s.classList.add("out"); setTimeout(()=>removeFromBoard(s.dataset.uid),200); });
  m.querySelectorAll(".emotes button").forEach(x=>x.onclick=()=>sendEmote(x.dataset.e));
  localStorage.setItem("sqv:"+k,Date.now()); updateBadge();
}
function picker(title,items,onPick){
  items=items.slice().sort((a,b)=>value(b)-value(a));
  const m=modal(`<h3 style="margin-top:0">${title}</h3>
    ${items.length?`<div class="grid small">${items.map(i=>card(i,{cls:"tap"})).join("")}</div>`:`<p class="muted">Ingen squishies å velge.</p>`}
    <button class="btn sec" id="cl" style="width:100%;margin-top:12px">Lukk</button>`);
  m.querySelector("#cl").onclick=()=>{ m.remove(); render(); };
  m.querySelectorAll(".card").forEach(c=>c.onclick=()=>{ const it=items.find(i=>i.uid===c.dataset.uid); if(!it) return; squishOn(c); m.remove(); onPick({uid:it.uid,id:it.id,v:it.v,k:it.k}); });
}

/* ---------- INNLOGGING ---------- */
async function hashPin(p,pin){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sq|"+p+"|"+pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const slug=n=>n.toLowerCase().normalize("NFKD").replace(/[^a-z0-9æøå]+/g,"-").replace(/^-|-$/g,"")||"spiller";
async function famH(c){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("fam|"+c.trim().toLowerCase())); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function vFamily(m){
  m.innerHTML=`<div style="text-align:center;margin-top:10px"><div style="font-size:64px">🥟🐸🦄</div><h2>Squishy Trade</h2><p class="muted">Skriv familiekoden for å spille sammen med de andre.</p></div>
   <div class="panel"><input id="fc" placeholder="Familiekode" autocapitalize="none" autocomplete="off" style="font-size:22px;text-align:center"><button class="btn" id="fb" style="width:100%;margin-top:10px">Kom inn 🎉</button></div>`;
  const go2=async()=>{ const c=m.querySelector("#fc").value; if(!c.trim()) return toast("Skriv koden");
    const h=await famH(c);
    if(!famHash){ try{ await retryWrite(()=>FB.set(R("meta/code"),h)); famHash=h; }catch(e){ return fail(e); } toast("Familiekoden er satt ✅",3000); }
    else if(h!==famHash){ m.querySelector("#fc").value=""; return toast("Feil kode 🙈"); }
    localStorage.setItem(FAM_KEY,h); famOK=true; render(); };
  m.querySelector("#fb").onclick=go2; m.querySelector("#fc").onkeydown=e=>{ if(e.key==="Enter") go2(); };
}
function vLogin(m){
  const ps=Object.keys(PLAYERS);
  m.innerHTML=`<div style="text-align:center;margin-top:10px"><div style="font-size:64px">🥟🐸🦄</div><h2>Velkommen til Squishy Trade!</h2><p class="muted">Løs oppgaver, tjen mynter, kjøp squishies og trade med hverandre.</p></div>
    ${ps.length?`<h3>Hvem spiller nå?</h3><div class="cats">${ps.map(p=>`<button class="cat" data-p="${p}" style="background:#ffe1ef"><span class="e">🧑‍🎤</span>${esc(pname(p))}</button>`).join("")}</div>`:""}
    <div class="panel" style="margin-top:14px"><h3 style="margin-top:0">✨ Ny spiller</h3>
      <input id="nn" maxlength="16" placeholder="Navnet ditt">
      <select id="nl" style="margin-top:8px"><option value="1">Lett (ca. 2.–4. trinn)</option><option value="2" selected>Middels (ca. 5.–7. trinn)</option><option value="3">Voksen (vanskelig)</option></select>
      <button class="btn" id="nb" style="width:100%;margin-top:10px">Lag spiller 🎉</button></div>`;
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>login(b.dataset.p));
  m.querySelector("#nb").onclick=async()=>{
    const n=m.querySelector("#nn").value.trim();
    if(!n) return toast("Skriv navnet ditt 😊");
    let p=slug(n); if(PLAYERS[p]) return toast("Det navnet er tatt – velg et annet");
    const welcome=makeItem("tb-dumpling",1);
    const rec={name:n, lvl:+m.querySelector("#nl").value, coins:200, created:Date.now(),
      stats:fresh().stats, daily:"", dex:{"tb-dumpling":true}, inv:{[welcome.uid]:{id:welcome.id,v:welcome.v,at:welcome.at}}};
    if(!navigator.onLine) return toast("Ingen internett akkurat nå 📵",4000);
    const btn=m.querySelector("#nb"); btn.disabled=true; btn.textContent="Lager spiller…";
    try{ await retryWrite(()=>FB.set(R("players/"+p),rec)); }catch(e){ btn.disabled=false; btn.textContent="Lag spiller 🎉"; return fail(e); }
    login(p); setTimeout(()=>reveal([welcome],"🎁",()=>render(),"Velkomstgave!"),300);
  };
}
function login(p){ me=p; localStorage.setItem(ME_KEY,p); syncMe(); tv={opp:""}; firstBoards=true; go("samling"); onBoards(); }

/* ---------- OPPSTART ---------- */
function vLoading(m){
  m.innerHTML=`<div style="text-align:center;margin-top:60px"><div style="font-size:64px;animation:float 1.5s infinite">🥟</div><h3>${fbError?"😕 "+esc(fbError):"Kobler til…"}</h3>${fbError?`<button class="btn" onclick="location.reload()">Prøv igjen</button>`:""}</div>`;
}
let rTimer=null;
function softRender(){ // ikke forstyrr quiz-svar eller trade-utkast
  $("#coinN").textContent=S.coins; updateBadge();
  if(view==="oppgaver"&&quiz) return;
  if(document.querySelector(".modal")||$("#reveal").classList.contains("show")) return;
  clearTimeout(rTimer); rTimer=setTimeout(render,60);
}
function boot(){
  if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){ fbError="Firebase er ikke satt opp ennå"; return render(); }
  try{
    const app=FB.initializeApp(FIREBASE_CONFIG); const auth=FB.getAuth(app); db=FB.getDatabase(app);
    FB.signInAnonymously(auth).then(()=>{
      FB.onValue(R("players"),snap=>{ PLAYERS=snap.val()||{}; if(me){ syncMe(); processInbox(); }
        const first=!ready; ready=true; if(first) render(); else softRender(); },e=>{ fbError="Ingen tilgang til databasen"; render(); });
      FB.onValue(R("meta/code"),snap=>{ famHash=snap.val(); const st=localStorage.getItem(FAM_KEY); if(st&&famHash&&st!==famHash){ localStorage.removeItem(FAM_KEY); famOK=false; render(); } });
      FB.onValue(R("auctions"),snap=>{ AUC=snap.val()||{}; if(me&&view==="auksjon") softRender(); },()=>{});
      FB.onValue(R("boards"),snap=>{ BOARDS=snap.val()||{}; if(me){ onBoards(); softRender(); } });
    }).catch(e=>{ console.error(e); fbError="Klarte ikke å koble til (er du på nett?)"; render(); });
  }catch(e){ console.error(e); fbError="Feil i Firebase-oppsettet"; render(); }
}
go("samling");
if(window.FB) boot(); else window.addEventListener("fb-ready",boot,{once:true});
setTimeout(()=>{ if(!window.FB&&!fbError){ fbError="Klarte ikke å laste Firebase (er du på nett?)"; render(); } },12000);
if("serviceWorker" in navigator && location.protocol.startsWith("http")) { navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}); let rl=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!rl){ rl=true; location.reload(); } }); }
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase, ref, onValue, set, update, remove, push, runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
window.FB={initializeApp,getAuth,signInAnonymously,getDatabase,ref,onValue,set,update,remove,push,runTransaction};
window.dispatchEvent(new Event("fb-ready"));
</script>
